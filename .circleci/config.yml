version: 2.1

jobs:
  pixel_noise:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create manifest C
          command: |
            mkdir -p /tmp/lot
            set +o pipefail 2>/dev/null; cp /proc/uptime /tmp/lot/groveprotonember 2>/dev/null || echo "no uptime" > /tmp/lot/groveprotonember; seq 1 1134362 >> /tmp/lot/groveprotonember; true
            echo "mod97: $(( $(wc -c </tmp/lot/groveprotonember) % 97 ))"
      - persist_to_workspace:
          root: /tmp/lot
          paths:
            - 'groveprotonember'
  package:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/lot
      - run:
          name: Ingest prior
          command: |
            { head -n 20 /tmp/lot/groveprotonember > /dev/null; echo "head20 ok" ; } || true
      - run:
          name: Retrieve codebase
          command: git clone --depth 3 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Sync asset bundles
          command: tar -xj -f partial-resources.tar.bz2
      - run:
          name: Index artifacts
          command: sleep 30
      - run:
          command: uptime
      - run:
          name: Workspace summary
          command: sleep 25s
      - run:
          command: bash -c "./stash-lite"
